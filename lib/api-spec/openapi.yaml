openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Cafe Munaco staff operations API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: operations
    description: Cafe Munaco operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /staff/me:
    get:
      operationId: getMyStaffProfile
      tags: [operations]
      summary: Get the signed-in employee profile
      responses:
        "200":
          description: Current employee profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /staff:
    get:
      operationId: listStaff
      tags: [operations]
      summary: List employee accounts
      responses:
        "200":
          description: Employee roster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createStaff
      tags: [operations]
      summary: Add an employee to the account roster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffInput"
      responses:
        "201":
          description: Employee roster entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /staff/{id}:
    patch:
      operationId: updateStaff
      tags: [operations]
      summary: Update an employee's role or account details
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffUpdate"
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [operations]
      summary: Get live restaurant operations summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /menu:
    get:
      operationId: listMenuItems
      tags: [operations]
      summary: List menu items
      responses:
        "200":
          description: Menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createMenuItem
      tags: [operations]
      summary: Create a menu item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemInput"
      responses:
        "201":
          description: Created menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /menu/{id}:
    patch:
      operationId: updateMenuItem
      tags: [operations]
      summary: Update menu details or availability
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemUpdate"
      responses:
        "200":
          description: Updated menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /orders:
    get:
      operationId: listOrders
      tags: [operations]
      summary: List recent orders
      responses:
        "200":
          description: Recent orders and their item lines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createOrder
      tags: [operations]
      summary: Submit an order to the kitchen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /orders/{id}:
    patch:
      operationId: updateOrder
      tags: [operations]
      summary: Update order status or payment state
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /reservations:
    get:
      operationId: listReservations
      tags: [operations]
      summary: List reservations and event bookings
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createReservation
      tags: [operations]
      summary: Create a reservation or event booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationInput"
      responses:
        "201":
          description: Created booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /reservations/{id}:
    patch:
      operationId: updateReservation
      tags: [operations]
      summary: Update booking details or status
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationUpdate"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /inventory:
    get:
      operationId: listInventory
      tags: [operations]
      summary: List stock items and freshness details
      responses:
        "200":
          description: Inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createInventoryItem
      tags: [operations]
      summary: Create a stock item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryInput"
      responses:
        "201":
          description: Created stock item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /inventory/{id}:
    patch:
      operationId: updateInventoryItem
      tags: [operations]
      summary: Update stock item details
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryUpdate"
      responses:
        "200":
          description: Updated stock item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /inventory/{id}/adjust:
    post:
      operationId: adjustInventory
      tags: [operations]
      summary: Record a stock delivery, usage, or correction
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryAdjustment"
      responses:
        "200":
          description: Updated stock item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Sign-in required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Role is not allowed to perform this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Record not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    StaffMember:
      type: object
      required: [id, name, email, role, linked, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role:
          type: string
          enum: [admin, cashier, waiter, kitchen, inventory]
        linked: { type: boolean }
        createdAt: { type: string, format: date-time }
    StaffInput:
      type: object
      required: [name, email, role]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        role:
          type: string
          enum: [admin, cashier, waiter, kitchen, inventory]
    StaffUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        role:
          type: string
          enum: [admin, cashier, waiter, kitchen, inventory]
    DashboardSummary:
      type: object
      required: [activeOrders, waitingOrders, reservationsToday, lowStockItems, revenueToday, recentActivity]
      properties:
        activeOrders: { type: integer }
        waitingOrders: { type: integer }
        reservationsToday: { type: integer }
        lowStockItems: { type: integer }
        revenueToday: { type: number }
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
    Activity:
      type: object
      required: [id, label, detail, occurredAt, kind]
      properties:
        id: { type: string }
        label: { type: string }
        detail: { type: string }
        occurredAt: { type: string, format: date-time }
        kind:
          type: string
          enum: [order, booking, stock]
    MenuItem:
      type: object
      required: [id, name, category, description, price, available]
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        description: { type: ["string", "null"] }
        price: { type: number }
        available: { type: boolean }
    MenuItemInput:
      type: object
      required: [name, category, price]
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        price: { type: number, minimum: 0 }
        available: { type: boolean, default: true }
    MenuItemUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        price: { type: number, minimum: 0 }
        available: { type: boolean }
    OrderLineInput:
      type: object
      required: [menuItemId, quantity]
      properties:
        menuItemId: { type: integer }
        quantity: { type: integer, minimum: 1 }
        notes: { type: ["string", "null"] }
    OrderLine:
      type: object
      required: [menuItemId, name, quantity, unitPrice, notes]
      properties:
        menuItemId: { type: integer }
        name: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
        notes: { type: ["string", "null"] }
    Order:
      type: object
      required: [id, orderNumber, tableName, customerName, orderType, status, paymentStatus, total, items, serverName, createdAt]
      properties:
        id: { type: integer }
        orderNumber: { type: string }
        tableName: { type: ["string", "null"] }
        customerName: { type: ["string", "null"] }
        orderType:
          type: string
          enum: [dine-in, takeout]
        status:
          type: string
          enum: [queued, preparing, ready, served, paid, cancelled]
        paymentStatus:
          type: string
          enum: [unpaid, paid]
        total: { type: number }
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
        serverName: { type: string }
        createdAt: { type: string, format: date-time }
    OrderInput:
      type: object
      required: [orderType, items]
      properties:
        tableName: { type: ["string", "null"] }
        customerName: { type: ["string", "null"] }
        orderType:
          type: string
          enum: [dine-in, takeout]
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderLineInput"
    OrderUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [queued, preparing, ready, served, paid, cancelled]
        paymentStatus:
          type: string
          enum: [unpaid, paid]
    Reservation:
      type: object
      required: [id, customerName, phone, startsAt, guests, bookingType, status, notes]
      properties:
        id: { type: integer }
        customerName: { type: string }
        phone: { type: string }
        startsAt: { type: string, format: date-time }
        guests: { type: integer }
        bookingType:
          type: string
          enum: [reservation, birthday, buffet, event]
        status:
          type: string
          enum: [pending, confirmed, arrived, completed, cancelled]
        notes: { type: ["string", "null"] }
    ReservationInput:
      type: object
      required: [customerName, phone, startsAt, guests, bookingType]
      properties:
        customerName: { type: string, minLength: 1 }
        phone: { type: string, minLength: 1 }
        startsAt: { type: string, format: date-time }
        guests: { type: integer, minimum: 1 }
        bookingType:
          type: string
          enum: [reservation, birthday, buffet, event]
        status:
          type: string
          enum: [pending, confirmed, arrived, completed, cancelled]
        notes: { type: ["string", "null"] }
    ReservationUpdate:
      type: object
      properties:
        customerName: { type: string, minLength: 1 }
        phone: { type: string, minLength: 1 }
        startsAt: { type: string, format: date-time }
        guests: { type: integer, minimum: 1 }
        bookingType:
          type: string
          enum: [reservation, birthday, buffet, event]
        status:
          type: string
          enum: [pending, confirmed, arrived, completed, cancelled]
        notes: { type: ["string", "null"] }
    InventoryItem:
      type: object
      required: [id, name, category, unit, quantity, parLevel, unitCost, supplier, expiresAt, updatedAt, lowStock]
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        unit: { type: string }
        quantity: { type: number }
        parLevel: { type: number }
        unitCost: { type: number }
        supplier: { type: ["string", "null"] }
        expiresAt: { type: ["string", "null"], format: date }
        updatedAt: { type: string, format: date-time }
        lowStock: { type: boolean }
    InventoryInput:
      type: object
      required: [name, category, unit, quantity, parLevel, unitCost]
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        unit: { type: string, minLength: 1 }
        quantity: { type: number, minimum: 0 }
        parLevel: { type: number, minimum: 0 }
        unitCost: { type: number, minimum: 0 }
        supplier: { type: ["string", "null"] }
        expiresAt: { type: ["string", "null"], format: date }
    InventoryUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        unit: { type: string, minLength: 1 }
        parLevel: { type: number, minimum: 0 }
        unitCost: { type: number, minimum: 0 }
        supplier: { type: ["string", "null"] }
        expiresAt: { type: ["string", "null"], format: date }
    InventoryAdjustment:
      type: object
      required: [change, reason]
      properties:
        change: { type: number }
        reason: { type: string, minLength: 1 }